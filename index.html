<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <!-- Configuração de responsividade e acessibilidade -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    />

    <!-- Título otimizado para SEO (máximo 60 caracteres) -->
    <title>Adventus Imobiliária | Compra, Venda e Aluguel em Açailândia</title>

    <!-- Descrição para mecanismos de busca (máximo 160 caracteres) -->
    <meta
      name="description"
      content="Encontre seu imóvel em Açailândia com a Adventus Imobiliária. Compra, venda e aluguel de casas, apartamentos e imóveis comerciais."
    />

    <!-- Palavras-chave estratégicas -->
    <meta
      name="keywords"
      content="imobiliária Açailândia, comprar imóvel Açailândia, alugar casa, venda apartamento, Adventus Imobiliária, corretor imóveis"
    />

    <!-- Autor e direitos autorais -->
    <meta name="author" content="Adventus Imobiliária" />
    <meta name="copyright" content="© 2025 Adventus Imobiliária" />

    <!-- Canonical URL para evitar conteúdo duplicado -->
    <link rel="canonical" href="https://adventusimobiliaria.com.br" />

    <!-- Ícone do site (favicon) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />

    <!-- Preconnect para melhor performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <!-- Fonte Montserrat - Otimizada -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome 6.5.0 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Tailwind CSS para utilitários -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuração CRÍTICA do Tailwind com Montserrat -->
    <script>
      tailwind.config = {
        theme: {
          fontFamily: {
            sans: ["Montserrat", "system-ui", "sans-serif"],
            montserrat: ["Montserrat", "sans-serif"],
          },
          extend: {
            colors: {
              "adventus-primary": "#31353E",
              "adventus-accent": "#e6a400",
              "adventus-yellow": "#f59e0b",
            },
          },
        },
      };
    </script>

    <!-- CSS CRÍTICO para separar fontes de texto e ícones -->
    <style>
      /* FORÇAR Montserrat para todos os textos */
      * {
        font-family: "Montserrat", sans-serif !important;
      }

      /* EXCEÇÃO: Ícones usam Font Awesome */
      .fa,
      .fas,
      .far,
      .fal,
      .fab,
      .fa-solid,
      .fa-regular,
      .fa-light,
      .fa-brands {
        font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
      }

      /* Garantir elementos específicos */
      body,
      div,
      p,
      span,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      a,
      button,
      li,
      ul,
      ol,
      td,
      th,
      input,
      textarea,
      select,
      label {
        font-family: "Montserrat", sans-serif !important;
      }

      /* Aplicar peso de fonte adequado para melhor legibilidade */
      body {
        font-weight: 400;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Garantir que títulos tenham peso correto */
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: 600 !important;
      }
    </style>
  </head>

  <body class="font-sans">
    <!-- Container principal da aplicação React -->
    <div id="root"></div>

    <!-- Arquivo principal do React (Vite) -->
    <script type="module" src="/src/main.jsx"></script>
